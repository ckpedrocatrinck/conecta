name: CI

on: push

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: conecta
          POSTGRES_PASSWORD: conecta_ci
          POSTGRES_DB: conecta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U conecta -d conecta_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # DATABASE_URL/POSTGRES_* configuram só o container de servico acima —
      # efemero, destruido no fim do job, sem exposicao fora do runner. Nao e'
      # segredo real (nenhum dado real trafega por ele), por isso fica literal
      # (INC-027 Bloco 5, achado A7-4 da auditoria de julho).
      DATABASE_URL: postgresql://conecta:conecta_ci@localhost:5432/conecta_test
      # Os 4 abaixo sao o MESMO NOME de variavel que carrega segredo real em
      # producao (rotacao documentada em docs/02-Arquitetura/rotacao-pepper.md
      # para CPF_HASH_PEPPER) — mesmo o valor de CI sendo inerte, ficam em
      # `secrets.*` para nao normalizar "segredo em texto claro no workflow"
      # como padrao aceitavel neste repositorio publico.
      APP_DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD }}
      APP_DATABASE_URL: postgresql://conecta_app:${{ secrets.APP_DB_PASSWORD }}@localhost:5432/conecta_test
      CPF_HASH_PEPPER: ${{ secrets.CPF_HASH_PEPPER }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      # Dummy, so' para o `npm run build`: `next build` roda com
      # NODE_ENV=production e importa toda rota (inclusive /api/auth), e o
      # Auth.js espera um segredo em producao. Valor inerte — a CI nao serve
      # request nenhuma. Em `secrets.*` pela mesma razao dos 3 acima.
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
